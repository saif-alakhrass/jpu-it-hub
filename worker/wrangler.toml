name = "jpu-it-hub-storage"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# R2 bucket binding — the bucket itself is private (no r2.dev public URL).
[[r2_buckets]]
binding = "FILES_BUCKET"
bucket_name = "jpu-it-hub-files"

# Environment variables (non-secret). Secrets are set via:
#   wrangler secret put SUPABASE_URL
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#   wrangler secret put JWT_SECRET
#   wrangler secret put R2_ACCESS_KEY_ID
#   wrangler secret put R2_SECRET_ACCESS_KEY
#   wrangler secret put R2_ACCOUNT_ID
[vars]
CORS_ALLOWED_ORIGINS = "http://localhost:5173,https://jpu-it-hub.vercel.app,https://jpu-it-85tkimn6b-jpu-it-hub.vercel.app"
MAX_FILE_SIZE_BYTES = "20971520"
UPLOAD_MAX_PER_WINDOW = "5"
UPLOAD_WINDOW_MINUTES = "10"
SIGNED_URL_EXPIRY_SECONDS = "300"
