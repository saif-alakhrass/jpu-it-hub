name = "jpu-it-hub-storage"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# R2 bucket binding — the bucket itself is private (no r2.dev public URL).
[[r2_buckets]]
binding = "FILES_BUCKET"
bucket_name = "jpu-it-hub-files"

# Environment variables (non-secret). Secrets are set via:
#   wrangler secret put SUPABASE_URL
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#   wrangler secret put JWT_SECRET
#   wrangler secret put R2_ACCESS_KEY_ID
#   wrangler secret put R2_SECRET_ACCESS_KEY
#   wrangler secret put R2_ACCOUNT_ID
[vars]
CORS_ALLOWED_ORIGINS = "http://localhost:5173,https://jpu-it-hub.vercel.app,https://jpu-it-85tkimn6b-jpu-it-hub.vercel.app"
MAX_FILE_SIZE_BYTES = "20971520"
UPLOAD_WINDOW_MINUTES = "10"
SIGNED_URL_EXPIRY_SECONDS = "300"
ACADEMIC_AUTH_ENABLED = "false"
MOODLE_SERVICE_NAME = "moodle_mobile_app"
# Set MOODLE_BASE_URL only in the isolated staging environment first.

# Isolated JPU-IT Hub V2 staging environment. It uses a separate Worker,
# database project, and R2 bucket so Moodle integration testing cannot touch
# production users or files.
[env.staging]
name = "jpu-it-hub-storage-v2-staging"
workers_dev = true

[[env.staging.r2_buckets]]
binding = "FILES_BUCKET"
bucket_name = "jpu-it-hub-files-v2-staging"

[env.staging.vars]
CORS_ALLOWED_ORIGINS = "http://localhost:5173,https://jpu-it-lei5gny3b-jpu-it-hub.vercel.app"
MAX_FILE_SIZE_BYTES = "20971520"
UPLOAD_WINDOW_MINUTES = "10"
SIGNED_URL_EXPIRY_SECONDS = "300"
ACADEMIC_AUTH_ENABLED = "true"
MOODLE_BASE_URL = "https://www.jpu.edu.jo/lms"
MOODLE_SERVICE_NAME = "moodle_mobile_app"
